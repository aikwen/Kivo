[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kivo"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = []
authors = [
  { name = "aikwen", email = "kwen.zou@outlook.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "PySide6>=6.8,<7",
]

[project.urls]
Documentation = "https://github.com/aikwen/kivo#readme"
Issues = "https://github.com/aikwen/kivo/issues"
Source = "https://github.com/aikwen/kivo"

[tool.hatch.version]
path = "src/kivo/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/kivo tests}"

[tool.coverage.run]
source_pkgs = ["kivo"]
branch = true
parallel = true
omit = [
  "src/kivo/__about__.py",
]

[tool.coverage.paths]
kivo = ["src/kivo", "*/kivo/src/kivo"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]